<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отзывы RUNGEL</title>
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#efede7; --ink:#1b1b19; --ink-2:#5c5b56; --ink-3:#8f8d86;
  --line:#e2dfd7; --accent:#2f7d4f; --accent-soft:#e3f1e8;
  --pos:#2f7d4f; --pos-bg:#e3f1e8; --neu:#6b6a64; --neu-bg:#ecebe6; --mix:#a3650f; --mix-bg:#f8ecd8; --neg:#b3392f; --neg-bg:#f8e1de;
  --spA:#2f5fa8; --spB:#a8452f; --spC:#6d3fa3;
  --hl:#fff3c4;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141413; --surface:#1d1d1b; --surface-2:#262624; --ink:#ecebe6; --ink-2:#b0aea7; --ink-3:#7d7b75;
    --line:#2f2f2c; --accent:#6cc28f; --accent-soft:#1f3328;
    --pos:#6cc28f; --pos-bg:#1f3328; --neu:#a9a7a0; --neu-bg:#2a2a27; --mix:#e0a54f; --mix-bg:#3a2e1b; --neg:#ea7a70; --neg-bg:#3d2220;
    --spA:#86aef0; --spB:#ef9a82; --spC:#bf9cf0; --hl:#3d3618;
  }
}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#1d1d1b; --surface-2:#262624; --ink:#ecebe6; --ink-2:#b0aea7; --ink-3:#7d7b75;
  --line:#2f2f2c; --accent:#6cc28f; --accent-soft:#1f3328;
  --pos:#6cc28f; --pos-bg:#1f3328; --neu:#a9a7a0; --neu-bg:#2a2a27; --mix:#e0a54f; --mix-bg:#3a2e1b; --neg:#ea7a70; --neg-bg:#3d2220;
  --spA:#86aef0; --spB:#ef9a82; --spC:#bf9cf0; --hl:#3d3618;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:32px 20px 80px}
h1{font-size:30px;line-height:1.15;margin:0;letter-spacing:-.01em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:0 0 10px;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}
.sub{color:var(--ink-2);margin-top:6px}

/* overview */
.overview{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:28px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px}
.headline{font-size:18px;line-height:1.4;font-weight:600;margin:0 0 14px}
.panel ul{margin:0;padding-left:18px}
.panel li{margin:5px 0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-2)}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;margin:6px 0 4px;background:var(--surface-2)}
.bar i{display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}
.pc{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px}
.pc h3{font-size:12px;margin:0 0 4px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.pc ul{padding-left:16px;font-size:14px}

/* cards */
.card{display:grid;grid-template-columns:300px 1fr;gap:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-top:18px}
.card.context{opacity:.82}
.vid{position:sticky;top:20px;align-self:start}
video{width:100%;aspect-ratio:9/16;background:#000;border-radius:10px;display:block;object-fit:contain}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-top:8px}
.num{font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--b);color:var(--c)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.kind{font-size:12px;border:1px dashed var(--line);border-radius:999px;padding:2px 9px;color:var(--ink-3)}
.card h3{font-size:19px;line-height:1.3;margin:8px 0 6px;letter-spacing:-.005em}
.who{color:var(--ink-2);font-size:14px;margin:0}
.ctx{color:var(--ink-3);font-size:13px;margin:2px 0 12px}
.quote{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0;font-size:15px;font-style:italic}
.points{margin:8px 0;padding-left:18px}
.points li{margin:3px 0}
.pcm{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pcm span{font-size:12.5px;border-radius:8px;padding:3px 9px}
.pcm .p{background:var(--pos-bg);color:var(--pos)}
.pcm .m{background:var(--neg-bg);color:var(--neg)}
.pcm .w{background:var(--mix-bg);color:var(--mix)}
.trh{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:18px 0 4px;padding-top:12px;border-top:1px solid var(--line);font-weight:600}
.tr{margin:0 -8px}
.seg{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer;transition:background .12s}
.seg:hover{background:var(--surface-2)}
.seg.on{background:var(--hl)}
.seg time{font-size:12px;color:var(--ink-3);padding-top:2px;font-variant-numeric:tabular-nums}
.seg b{font-size:12px;font-weight:600;color:var(--sp);display:block}
.seg p{margin:0}
.empty{color:var(--ink-3);font-style:italic;font-size:14px}
footer{margin-top:40px;color:var(--ink-3);font-size:12.5px}

@media (max-width:860px){
  .overview{grid-template-columns:1fr}
  .card{grid-template-columns:1fr;gap:14px;padding:16px}
  .vid{position:static;max-width:300px;width:100%;margin:0 auto}
  .wrap{padding:20px 16px 60px}
  h1{font-size:24px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Видео-отзывы RUNGEL</h1>
      <div class="sub" id="sub"></div>
    </div>
  </div>

  <section class="overview">
    <div class="panel">
      <h2>Общая картина</h2>
      <p class="headline" id="headline"></p>
      <ul id="opoints"></ul>
    </div>
    <div class="panel">
      <h2>В цифрах</h2>
      <div class="stats" id="stats"></div>
      <div class="bar" id="bar"></div>
      <div class="legend" id="legend"></div>
      <div class="pc" id="pc"></div>
    </div>
  </section>

  <main id="list"></main>
  <footer>Транскрипция: faster-whisper large-v3 · диаризация: pyannote community-1 · тексты вычитаны вручную, неразборчивые места помечены [неразборчиво]. Клик по реплике перематывает видео.</footer>
</div>

<script>
const DATA = /*__DATA__*/null;
const SENT = {
  positive:{label:"Позитив", c:"--pos", b:"--pos-bg"},
  mixed:{label:"Смешанный", c:"--mix", b:"--mix-bg"},
  neutral:{label:"Нейтрально", c:"--neu", b:"--neu-bg"},
  negative:{label:"Негатив", c:"--neg", b:"--neg-bg"}
};
const SPC = ["--spA","--spB","--spC"];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = t => { t = Math.floor(t); return Math.floor(t/60) + ":" + String(t%60).padStart(2,"0"); };

const R = DATA.reviews;
const O = DATA.overview;
const total = R.reduce((a,r)=>a+(r.duration||0),0);
const reviewsN = R.filter(r=>r.kind==="review").length;
$("#sub").textContent = `${R.length} видео · ${Math.round(total/60)} мин записи · ${reviewsN} с мнением о продукте`;
$("#headline").textContent = O.headline;
$("#opoints").innerHTML = O.points.map(p=>`<li>${esc(p)}</li>`).join("");

const cnt = {}; R.forEach(r=>cnt[r.sentiment]=(cnt[r.sentiment]||0)+1);
$("#stats").innerHTML = [
  [cnt.positive||0, "позитивных"],
  [cnt.negative||0, "негативных"],
  [reviewsN, "отзывов с мнением"],
  [Math.round(total/60)+" мин", "общая длина"]
].map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");
const order = ["positive","mixed","neutral","negative"];
$("#bar").innerHTML = order.filter(k=>cnt[k]).map(k=>`<i style="width:${cnt[k]/R.length*100}%;background:var(${SENT[k].c})" title="${SENT[k].label}: ${cnt[k]}"></i>`).join("");
$("#legend").innerHTML = order.filter(k=>cnt[k]).map(k=>`<span style="--c:var(${SENT[k].c})">${SENT[k].label} ${cnt[k]}</span>`).join("");
const list = (t,a)=>a&&a.length?`<div><h3>${t}</h3><ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:"";
$("#pc").innerHTML = list("Хвалят", O.pros) + list("Критикуют", O.cons) + list("Просят", O.wishes);

/* cards */
function card(r, i){
  const S = SENT[r.sentiment];
  const spk = Object.keys(r.speakers||{});
  const pcm = [...(r.pros||[]).map(x=>`<span class="p">+ ${esc(x)}</span>`), ...(r.cons||[]).map(x=>`<span class="m">− ${esc(x)}</span>`), ...(r.wishes||[]).map(x=>`<span class="w">→ ${esc(x)}</span>`)].join("");
  const segs = r.segments.length ? r.segments.map((s,j)=>{
    const color = SPC[spk.indexOf(s.sp)] || SPC[0];
    return `<div class="seg" data-s="${s.s}" data-e="${s.e}" style="--sp:var(${color})"><time>${fmt(s.s)}</time><div><b>${esc(r.speakers[s.sp]||s.sp)}</b><p>${esc(s.t)}</p></div></div>`;
  }).join("") : `<p class="empty">В видео нет речи.</p>`;
  return `<article class="card ${r.kind}" id="${r.id}">
    <div class="vid">
      <video src="${esc(r.file)}" controls preload="metadata" playsinline></video>
      <div class="meta"><span class="num">#${i+1}</span><span class="num">${fmt(r.duration)}</span><span>${esc(r.file.split("/").pop())}</span></div>
    </div>
    <div>
      <div class="meta"><span class="badge" style="--c:var(${S.c});--b:var(${S.b})">${S.label}</span>${r.kind==="context"?`<span class="kind">контекст, без мнения о продукте</span>`:""}</div>
      <h3>${esc(r.title)}</h3>
      <p class="who">${esc(r.who)}</p>
      <p class="ctx">${esc(r.context)}</p>
      ${r.quote?`<blockquote class="quote">«${esc(r.quote)}»</blockquote>`:""}
      <ul class="points">${r.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
      ${pcm?`<div class="pcm">${pcm}</div>`:""}
      <h4 class="trh">Транскрипция</h4>
      <div class="tr">${segs}</div>
    </div>
  </article>`;
}
$("#list").innerHTML = R.map(card).join("");
function bind(){
  document.querySelectorAll(".card").forEach(c=>{
    const v = c.querySelector("video"), segs = [...c.querySelectorAll(".seg")];
    segs.forEach(s=>s.onclick=()=>{ v.currentTime=+s.dataset.s; v.play(); });
    v.addEventListener("play", ()=>document.querySelectorAll("video").forEach(o=>o!==v&&o.pause()));
    v.addEventListener("timeupdate", ()=>{
      const t = v.currentTime;
      segs.forEach(s=>s.classList.toggle("on", t>=+s.dataset.s && t<+s.dataset.e+0.3));
    });
  });
}
bind();
</script>
</body>
</html>
